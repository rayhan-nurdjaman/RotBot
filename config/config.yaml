max_tool_steps: 8
# History is trimmed in chunks so the cached prompt prefix survives between trims. The window grows to
# context_length + (context_length * this fraction) messages, then is cut back to context_length.
context_trim_fraction: 0.5
# Shared by reasoning and the visible reply, so it must be generous or a thinking model can run out before answering.
max_tokens: 16000
# Per LLM request, in seconds. The openai SDK retries timeouts, 429s and 5xx up to llm_max_retries times with backoff.
llm_timeout_s: 180
llm_max_retries: 2
# Per auto-routing call to Jev, in seconds (src/router.py). On timeout or any other failure the cheapest model is used.
jev_timeout_s: 5
# Per tool call, in seconds. A timed-out tool returns an error to the model so it can recover.
# A tool can declare its own longer limit with @tool(timeout=...) (bash does).
tool_timeout_s: 30
# The longest a bash command may be asked to run, in seconds (the default is 20). The whole bot handles one update at a
# time, so while a command runs no other chat is answered: keep this low.
bash_max_timeout_s: 120
# The folder file and shell tools are meant to stay inside (bash's `cwd` argument must be in it). `~` is the home folder
# of the user running the bot. Quoted on purpose: an unquoted ~ is read by YAML as null. A guard against mistakes and
# prompt injection, not a sandbox: bash can still run `cd` and `cat` on anything the user can.
workspace_root: '~'
# IANA timezone used to show the current time to the model and to read reminder times that have no UTC offset.
# One zone for every chat. Times are stored in UTC, so changing this does not move existing reminders.
timezone: Asia/Singapore
# Most one chat may spend per calendar day (in `timezone`), in USD as OpenRouter reports cost. Checked at the start of a
# turn, so a turn that starts just under the cap can end over it. See src/usage.py.
daily_cap_usd: 1.00
